---
name: Build sdist and wheels

on:
  push:
  pull_request:
  release:
    types:
      - published
jobs:
  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Create sdist
        shell: bash -l {0}
        run: |
          python -m pip install -q build
          python -m build -s

      - name: Upload sdist to build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: "Build wheels on ${{ matrix.os }} ${{ matrix.cibw_archs }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cibw_archs: "AMD64"
          - os: windows-latest
            cibw_archs: "ARM64"
          - os: macos-15-intel
            cibw_archs: "x86_64"
            deploy_target: "13"
          - os: macos-14
            cibw_archs: "arm64"
            deploy_target: "14"
          - os: ubuntu-24.04-arm
            cibw_archs: "aarch64"
          - os: ubuntu-22.04
            cibw_archs: "x86_64"
          # riscv64 has no GitHub-hosted runner yet; to keep build times
          # reasonable we dispatch to RISC-V hardware (ubuntu-24.04-riscv label,
          # requires a RISE RISC-V GitHub App installed on the repo). numpy has
          # no riscv64 wheels on PyPI, so pull it from the RISE index via
          # PIP_EXTRA_INDEX_URL (PyPI stays primary; pure-Python packages such
          # as Cython/pytest fall through to PyPI). PIP_PREFER_BINARY=1 makes
          # pip pick the highest numpy version that has a riscv64 wheel instead
          # of trying to build the latest numpy from sdist (which has no
          # riscv64 wheel for older cp tags like cp39/cp310).
          - os: ubuntu-24.04-riscv
            cibw_archs: "riscv64"
            cibw_environment: "PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_PREFER_BINARY=1"

    env:
      # Single source of truth for the cibuildwheel version. The non-riscv64
      # path pins the same version literally in `uses:` below (GitHub Actions
      # forbids expressions in `uses:`); the drift-guard step fails the build
      # if the two diverge.
      CIBW_VERSION: "4.1.1"
      CIBW_SKIP: "*i686 *-musllinux_aarch64 *-musllinux_riscv64"
      CIBW_ARCHS: "${{ matrix.cibw_archs }}"
      CIBW_TEST_COMMAND: "pytest -v --pyargs pykdtree"
      CIBW_TEST_REQUIRES: "pytest mypy"
      CIBW_TEST_SKIP: "*-win_arm64"
      CIBW_BUILD_VERBOSITY: 1
      # we use openmp (libomp) from homebrew which has a current limit of
      # macos 14 (Sonoma) on intel: https://formulae.brew.sh/formula/libomp
      CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=14"
      CIBW_BEFORE_BUILD_MACOS: "brew install libomp"
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
      # Per-arch Linux environment; empty for non-riscv64 entries so
      # existing builds are unaffected. For riscv64 it carries the RISE
      # extra index URL (and is also the place to add USE_OMP=0 if
      # OpenMP linking turns out to be a problem).
      CIBW_ENVIRONMENT_LINUX: "${{ matrix.cibw_environment }}"
      # Pin the riscv64 manylinux image explicitly for clarity (this is
      # also cibuildwheel's default for the arch).
      CIBW_MANYLINUX_RISCV64_IMAGE: "manylinux_2_39"

    steps:
      - uses: actions/checkout@v7
      - run: |
          git fetch --prune --unshallow

      - name: Assert cibuildwheel versions match
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ref=$(grep -oE 'pypa/cibuildwheel@v[0-9.]+' .github/workflows/deploy-wheels.yml \
                | grep -oE '[0-9.]+' | sort -u)
          if [ "$ref" != "$CIBW_VERSION" ]; then
            echo "cibuildwheel version drift: action ref=$ref, CIBW_VERSION=$CIBW_VERSION" >&2
            exit 1
          fi

      - name: Build wheels
        if: matrix.cibw_archs != 'riscv64'
        uses: pypa/cibuildwheel@v4.1.1

      - name: Build wheels (native riscv64)
        if: matrix.cibw_archs == 'riscv64'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cibw"
          "$RUNNER_TEMP/cibw/bin/pip" install -q --upgrade pip
          "$RUNNER_TEMP/cibw/bin/pip" install "cibuildwheel==${CIBW_VERSION}"
          "$RUNNER_TEMP/cibw/bin/cibuildwheel" --output-dir wheelhouse

      - name: Upload wheel(s) as build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}"
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Download wheels artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish package to PyPI
        if: github.event.action == 'published'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          user: ${{ secrets.pypi_username }}
          password: ${{ secrets.pypi_password }}
          skip-existing: true
