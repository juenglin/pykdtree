---
name: Build sdist and wheels

on:
  push:
  pull_request:
  release:
    types:
      - published
jobs:
  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Create sdist
        shell: bash -l {0}
        run: |
          python -m pip install -q build
          python -m build -s

      - name: Upload sdist to build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: "Build wheels on ${{ matrix.os }} ${{ matrix.cibw_archs }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cibw_archs: "AMD64"
          - os: windows-latest
            cibw_archs: "ARM64"
          - os: macos-15-intel
            cibw_archs: "x86_64"
            deploy_target: "13"
          - os: macos-14
            cibw_archs: "arm64"
            deploy_target: "14"
          - os: ubuntu-24.04-arm
            cibw_archs: "aarch64"
          - os: ubuntu-22.04
            cibw_archs: "x86_64"
          # riscv64 has no native GitHub-hosted runner; cibuildwheel builds it
          # under QEMU on an x86_64 host. riscv64 build/test dependencies
          # (numpy, Cython) are not on PyPI, so pull binaries from the RISE
          # index via PIP_EXTRA_INDEX_URL (PyPI stays primary; pure-Python
          # packages such as setuptools/pytest fall through to PyPI).
          - os: ubuntu-24.04
            cibw_archs: "riscv64"
            cibw_environment: "PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/"

    steps:
      - uses: actions/checkout@v7
      - run: |
          git fetch --prune --unshallow

      - name: Set up QEMU for emulated builds
        if: matrix.cibw_archs == 'riscv64'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_SKIP: "*i686 *-musllinux_aarch64 *-musllinux_riscv64"
          CIBW_ARCHS: "${{ matrix.cibw_archs }}"
          CIBW_TEST_COMMAND: "pytest -v --pyargs pykdtree"
          CIBW_TEST_REQUIRES: "pytest mypy"
          CIBW_TEST_SKIP: "*-win_arm64"
          CIBW_BUILD_VERBOSITY: 1
          # we use openmp (libomp) from homebrew which has a current limit of
          # macos 14 (Sonoma) on intel: https://formulae.brew.sh/formula/libomp
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=14"
          CIBW_BEFORE_BUILD_MACOS: "brew install libomp"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
          # Per-arch Linux environment; empty for non-riscv64 entries so
          # existing builds are unaffected. For riscv64 it carries the RISE
          # extra index URL (and is also the place to add USE_OMP=0 if
          # emulated OpenMP linking turns out to be a problem).
          CIBW_ENVIRONMENT_LINUX: "${{ matrix.cibw_environment }}"
          # Pin the riscv64 manylinux image explicitly for clarity (this is
          # also cibuildwheel's default for the arch).
          CIBW_MANYLINUX_RISCV64_IMAGE: "manylinux_2_39"

      - name: Upload wheel(s) as build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}"
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Download wheels artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish package to PyPI
        if: github.event.action == 'published'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          user: ${{ secrets.pypi_username }}
          password: ${{ secrets.pypi_password }}
          skip-existing: true
